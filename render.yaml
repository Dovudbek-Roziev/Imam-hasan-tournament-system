services:
  - type: web
    name: imam-hasan-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.13.0
      - key: TOURNAMENT_TIME_ZONE
        value: Asia/Bishkek
      - key: JWT_TTL_SECONDS
        value: "3600"
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: imam-hasan-admin
    runtime: static
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: VITE_API_URL
        sync: false
